<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>GitMate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ============ 左侧导航栏 ============ -->
    <aside id="sidebar">
      <div class="logo">Git<span>Mate</span></div>
      <nav id="nav">
        <button class="nav-btn active" data-tab="changes">
          <span class="nav-icon">✎</span><span>变更</span><span id="chg-count" class="nav-badge hidden">0</span>
        </button>
        <button class="nav-btn" data-tab="history">
          <span class="nav-icon">◷</span><span>历史</span>
        </button>
        <button class="nav-btn" data-tab="branches">
          <span class="nav-icon">⑂</span><span>分支</span>
        </button>
        <button class="nav-btn" data-tab="compare">
          <span class="nav-icon">⇄</span><span>对比</span>
        </button>
      </nav>
      <div id="sidebar-repos" class="sidebar-repos"></div>
      <div class="sidebar-bottom">
        <div id="repo-mini" class="repo-mini hidden">
          <div class="repo-mini-name"></div>
          <div class="repo-mini-branch"></div>
        </div>
        <button id="open-repo-btn" class="btn-ghost btn-block">＋ 打开仓库</button>
      </div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <main id="main">
      <header id="topbar">
        <div id="repo-title">
          <span id="repo-name" class="repo-name">未打开仓库</span>
          <span id="repo-path" class="repo-path"></span>
        </div>
        <div id="branch-wrap" class="branch-wrap hidden">
          <span class="branch-dot"></span><span id="branch-name"></span>
          <span id="ab-badge" class="ab-badge hidden"></span>
        </div>
        <div class="top-actions">
          <button id="pull-btn" class="btn-ghost" title="拉取远程更新">⬇ 拉取</button>
          <button id="push-btn" class="btn-ghost" title="推送到远程">⬆ 推送</button>
          <button id="refresh-btn" class="btn-ghost" title="刷新 (F5)">⟳</button>
        </div>
      </header>

      <!-- ===== 提示条（仅异常时出现） ===== -->
      <div id="banner" class="banner hidden">
        <span id="banner-text"></span>
        <span class="banner-flex"></span>
        <button id="banner-action" class="btn-mini banner-btn"></button>
      </div>

      <!-- ===== 变更视图：单列表 + 勾选即提交 ===== -->
      <section id="view-changes" class="view active">
        <div class="changes-col">
          <div class="panel changes-panel">
            <div class="panel-head">
              <span>改动</span>
              <span class="panel-actions">
                <button id="check-all-btn" class="btn-mini">全部勾选</button>
                <button id="uncheck-all-btn" class="btn-mini">全部取消</button>
                <button id="discard-all-btn" class="btn-mini danger">全部丢弃</button>
              </span>
            </div>
            <div class="list-tip">勾选 = 纳入下次提交；点文件名查看差异；右键更多操作</div>
            <div class="file-table-head"><span></span><span>文件</span><span>工作区</span><span>下次提交</span></div>
            <div id="change-list" class="file-list"></div>
          </div>
        </div>
        <div class="diff-col panel">
          <div id="diff-head" class="diff-head hidden">
            <span id="diff-file"></span>
          </div>
          <div id="diff-body" class="diff-body"><div class="placeholder">选择左侧文件查看差异</div></div>
        </div>
      </section>

      <!-- ===== 历史视图 ===== -->
      <section id="view-history" class="view">
        <div class="hist-col panel">
          <div class="panel-head">
            <span>提交历史</span>
            <span class="panel-actions">
              <input id="history-search" class="input-inline" placeholder="搜索消息/作者…" />
            </span>
          </div>
          <div id="commit-list" class="commit-list"></div>
        </div>
        <div class="panel hist-detail">
          <div id="commit-detail-head" class="commit-detail-head hidden">
            <div id="cd-subject"></div>
            <div id="cd-meta"></div>
            <div id="cd-refs"></div>
          </div>
          <div id="cd-files" class="file-list cd-files"></div>
          <div id="cd-diff" class="diff-body"></div>
        </div>
      </section>

      <!-- ===== 分支视图 ===== -->
      <section id="view-branches" class="view">
        <div class="panel branch-col">
          <div class="panel-head">
            <span>分支</span>
            <span class="panel-actions">
              <input id="branch-search" class="input-inline" placeholder="搜索分支…" />
              <input id="new-branch-name" class="input-inline" placeholder="新分支名" />
              <button id="new-branch-btn" class="btn-mini">＋ 新建</button>
            </span>
          </div>
          <div id="branch-list" class="branch-list"></div>
        </div>
      </section>

      <!-- ===== 对比视图 ===== -->
      <section id="view-compare" class="view">
        <div class="panel compare-col">
          <div class="panel-head">
            <span>分支对比</span>
            <span class="panel-actions">
              <select id="cmp-a" class="select-inline"></select>
              <span class="cmp-vs">…</span>
              <select id="cmp-b" class="select-inline"></select>
              <button id="cmp-go-btn" class="btn-mini">对比</button>
            </span>
          </div>
          <div id="compare-list" class="file-list"></div>
        </div>
        <div class="panel compare-diff">
          <div id="cmp-diff-head" class="diff-head hidden"><span id="cmp-file"></span></div>
          <div id="cmp-diff-body" class="diff-body"><div class="placeholder">选择两个分支，点左侧文件查看差异</div></div>
        </div>
      </section>

      <!-- ===== 提交条（固定不随页签消失） ===== -->
      <div id="commit-bar" class="commit-bar hidden">
        <textarea id="commit-msg" rows="2" placeholder="提交消息（一行写完）…"></textarea>
        <button id="commit-btn" class="btn-primary">提交</button>
      </div>

      <!-- ===== 命令预览与日志栏 ===== -->
      <div id="cmdbar">
        <div id="cmdbar-row">
          <button id="cmdbar-toggle" class="cmd-toggle">▾ 命令与日志</button>
          <span id="cmd-last" class="cmd-last">尚未执行命令</span>
        </div>
        <div id="cmd-log" class="cmd-log hidden"></div>
      </div>

      <!-- ===== 未打开仓库时的欢迎页 ===== -->
      <section id="welcome" class="welcome">
        <div class="welcome-card">
          <div class="welcome-logo">Git<span>Mate</span></div>
          <p>一个现代化、简单易用的 Git 桌面客户端</p>
          <div class="welcome-btns">
            <button id="welcome-open-btn" class="btn-primary btn-lg">打开一个 Git 仓库</button>
            <button id="welcome-clone-btn" class="btn-ghost btn-lg">克隆远程仓库</button>
          </div>
          <div id="recent-repos" class="recent-repos"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 右键菜单 -->
  <div id="ctx-menu" class="ctx-menu hidden"></div>
  <!-- 模态框 -->
  <div id="modal-wrap" class="modal-wrap hidden">
    <div id="modal" class="modal">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-ghost">取消</button>
        <button id="modal-ok" class="btn-primary">确定</button>
      </div>
    </div>
  </div>
  <!-- Toast -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="app.js"></script>
</body>
</html>
